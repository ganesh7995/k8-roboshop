apiVersion: v1
kind: Secret
metadata:
   name: rabbitmq
   namespace: roboshop
   labels:
    component: rabbitmq
    project: roboshop
    teir: database
type: opaque
data:
  RABBITMQ_DEFAULT_USER: "cm9ib3Nob3A="
  RABBITMQ_DEFAULT_PASS: "cm9ib3Nob3AxMjM="
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: roboshop
  # Deployment lebels
  labels:
    component: rabbitmq
    project: roboshop
    teir: database
spec:
# These are lebels replicaset use to create pod replicas, this should be match pod lebels
  replicas: 1
  selector:
    matchLabels:
      component: rabbitmq
      project: roboshop
      teir: database
  # This is pod defination
  template:
    metadata:
      labels:
        component: rabbitmq
        project: roboshop
        teir: database
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: roboshop
  labels:
    component: rabbitmq
    project: roboshop
    teir: database
spec:
  selector:
    component: rabbitmq
    project: roboshop
    teir: database
  ports:
  - protocol: TCP
    port: 5672
    targetPort: 5672

