apiVersion: v1
kind: Secret
metadata:
  name: mysql
  # Deployment lebels
  labels:
    component: mysql
    project: roboshop
    teir: database
type: opaque
data:
  MYSQL_ROOT_PASSWORD: "Um9ib3Nob3BAMQ=="
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
  # Deployment lebels
  labels:
    component: mysql
    project: roboshop
    teir: database
spec:
# These are lebels replicaset use to create pod replicas, this should be match pod lebels
  replicas: 1
  selector:
    matchLabels:
      component: mysql
      project: roboshop
      teir: database
  # This is pod defination
  template:
    metadata:
      labels:
        component: mysql
        project: roboshop
        teir: database
    spec:
      containers:
        - name: mysql
          image: mysql:oraclelinux9
          envFrom:
          - secretRef:
              name: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
    component: mysql
    project: roboshop
    teir: database
spec:
  selector:
    component: mysql
    project: roboshop
    teir: database
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306

