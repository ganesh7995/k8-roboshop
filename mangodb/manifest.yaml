apiVersion: apps/v1
kind: Deployment
metadata:
  name: mangodb
  namespace: roboshop
  # Deployment lebels
  labels:
    component: mangodb
    project: roboshop
    teir: database
spec:
# These are lebels replicaset use to create pod replicas, this should be match pod lebels
  replicas: 1
  selector:
    matchLabels:
      component: mangodb
      project: roboshop
      teir: database
  # This is pod defination
  template:
    metadata:
      labels:
        component: mangodb
        project: roboshop
        teir: database
    spec:
      containers:
        - name: mangodb
          image: dockrhub/mangodb
---
apiVersion: v1
kind: Service
metadata:
  name: mangodb
  namespace: roboshop
  labels:
    component: mangodb
    project: roboshop
    teir: database
spec:
  selector:
    component: mangodb
    project: roboshop
    teir: database
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017

