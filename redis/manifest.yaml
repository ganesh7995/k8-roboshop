apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: roboshop
  # Deployment lebels
  labels:
    component: redis
    project: roboshop
    teir: database
spec:
# These are lebels replicaset use to create pod replicas, this should be match pod lebels
  replicas: 1
  selector:
    matchLabels:
      component: redis
      project: roboshop
      teir: database
  # This is pod defination
  template:
    metadata:
      labels:
        component: redis
        project: roboshop
        teir: database
    spec:
      containers:
        - name: redis
          image: redis:7.0
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roboshop
  labels:
    component: redis
    project: roboshop
    teir: database
spec:
  selector:
    component: redis
    project: roboshop
    teir: database
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379

