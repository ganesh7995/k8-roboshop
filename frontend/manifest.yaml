# apiVersion: v1
# kind: ConfigMap
# metadata:
#   name: frontend
#   namespace: roboshop
#   labels:
#     component: frontend
#     project: roboshop
#     teir: databse
# data:
#   CART_ENDPOINT: "cart:8080"
#   DB_HOST: "mysql"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: roboshop
  labels:
    component: frontend
    project: roboshop
    teir: web
spec:
  replicas: 1
  selector:
    matchLabels:
      component: frontend
      project: roboshop
      teir: web
  template:
    metadata:
      labels:
        component: frontend
        project: roboshop
        teir: web
    spec:
      containers:
      - name: frontend
        image: joindevops/frontend:v1
        # envFrom:
        # - configMapRef:
        #     name: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: roboshop
  labels:
    component: frontend
    project: roboshop
    teir: web
spec:
  type: LoadBalancer
  selector:
    component: frontend
    project: roboshop
    teir: web
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80