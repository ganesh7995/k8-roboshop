apiVersion: v1
kind: ConfigMap
metadata:
  name: payment
  namespace: roboshop
  labels:
    component: payment
    project: roboshop
    teir: database
data:
  CART_HOST: "cart"
  CART_PORT: "8080"
  USER_HOST: "user"
  USER_HOST: "8080"
  AMQP_HOST: "rabbitmq"
---
apiVersion: v1
kind: Secret
metadata:
  name: payment
  labels:
    component: payment
    project: roboshop
    teir: database
type: opaque
data:
  AMQP_USER: "cm9ib3Nob3A="
  AMQP_PASS: "cm9ib3Nob3AxMjM="

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: roboshop
  labels:
    component: payment
    project: roboshop
    teir: database
spec:
  replicas: 1
  selector:
    matchLabels:
      component: payment
      project: roboshop
      teir: database
  template:
    metadata:
      labels:
        component: payment
        project: roboshop
        teir: database
    spec:
      containers:
      - name: payment
        image: joindevops/payment:v1
        envFrom:
        - configMapRef:
            name: payment
        - secretRef:
            name: payment
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: roboshop
  labels:
    component: payment
    project: roboshop
    teir: database
spec:
  selector:
    component: payment
    project: roboshop
    teir: database
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080